name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Verificar higiene do repositório
        run: python scripts/check_repository_hygiene.py
      - name: Verificar importação do código
        run: python -m compileall -q run_gui.py benedito_cli.py src scripts
      - name: Executar testes
        run: python -m pytest -q
