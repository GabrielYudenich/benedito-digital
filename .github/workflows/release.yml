name: Release Windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m venv venv
      - run: .\venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-build.txt
      - name: Conferir versão da tag
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}".TrimStart('v')
          $Configured = (Get-Content config.json -Raw | ConvertFrom-Json).version
          if ($Version -ne $Configured) { throw "Tag $Version difere de config.json $Configured" }
      - name: Gerar MSI
        shell: pwsh
        run: .\scripts\build_windows.ps1 -SkipMsi
      - name: Assinar executável
        if: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $Certificate = Join-Path $env:RUNNER_TEMP "benedito-signing.pfx"
          [IO.File]::WriteAllBytes($Certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          .\scripts\sign_windows_release.ps1 -CertificatePath $Certificate -CertificatePassword $env:CERTIFICATE_PASSWORD -Target executable
          Remove-Item -LiteralPath $Certificate -Force
      - name: Montar MSI com executável final
        shell: pwsh
        run: .\scripts\build_windows.ps1 -SkipTests -SkipApp
      - name: Assinar MSI
        if: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $Certificate = Join-Path $env:RUNNER_TEMP "benedito-signing.pfx"
          [IO.File]::WriteAllBytes($Certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          .\scripts\sign_windows_release.ps1 -CertificatePath $Certificate -CertificatePassword $env:CERTIFICATE_PASSWORD -Target msi
          Remove-Item -LiteralPath $Certificate -Force
      - name: Verificar MSI
        if: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 == '' }}
        shell: pwsh
        run: .\scripts\verify_windows_release.ps1
      - name: Verificar MSI assinado
        if: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: .\scripts\verify_windows_release.ps1 -RequireSignature
      - name: Criar manifesto
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}".TrimStart('v')
          .\venv\Scripts\python.exe .\scripts\create_release_manifest.py --msi ".\dist\BeneditoDigital-$Version-x64.msi" --version $Version --output ".\dist\release-manifest.json"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BeneditoDigital-*.msi
            dist/release-manifest.json
